name: ASCameraExample

options:
  bundleIdPrefix: global.shooters.ascamera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ASCamera:
    path: ../..

targets:
  ASCameraExample:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ASCamera
        product: ASCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: global.shooters.ascamera.example
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "ASCamera Example records video using your camera."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ASCamera Example records audio together with your video."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES

schemes:
  ASCameraExample:
    build:
      targets:
        ASCameraExample: all
    run:
      config: Debug
    test:
      config: Debug
